---
layout: default
---
<article class="max-w-3xl mx-auto px-5 sm:px-6 py-16 sm:py-20">
  <h1 class="text-[2.4rem] sm:text-[3rem] font-bold tracking-[-0.03em] leading-[1.1]">{{ page.title }}</h1>
  {% if page.subtitle %}<p class="mt-3 text-[15px] text-subtle">{{ page.subtitle }}</p>{% endif %}
  <div class="mt-10 prose prose-pico max-w-none text-ink/85 leading-relaxed
              prose-headings:font-semibold prose-headings:tracking-tight prose-headings:text-ink
              prose-h2:text-[1.4rem] prose-h2:mt-11 prose-h2:mb-3
              prose-h3:text-[1.1rem] prose-h3:mt-8 prose-h3:mb-2
              prose-p:my-4 prose-li:my-1 prose-ul:my-4 prose-ol:my-4 prose-strong:text-ink">
    {{ content }}
  </div>
</article>
