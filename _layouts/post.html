---
layout: default
---
<article class="max-w-2xl mx-auto px-5 sm:px-6 py-16 sm:py-20">
  <a href="/blog/" class="inline-flex items-center gap-1.5 text-[14px] text-subtle hover:text-ink transition-colors mb-8">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    All posts
  </a>
  <p class="text-[13px] font-medium text-[#0071e3] uppercase tracking-wide mb-3">{{ page.date | date: "%B %d, %Y" }}</p>
  <h1 class="text-3xl sm:text-[2.6rem] font-bold tracking-tight leading-[1.1] mb-10">{{ page.title }}</h1>
  <div class="prose prose-pico prose-lg max-w-none text-ink/90 leading-relaxed
              prose-headings:font-semibold prose-headings:tracking-tight prose-headings:text-ink
              prose-h2:text-2xl prose-h2:mt-12 prose-h3:text-xl prose-h3:mt-9
              prose-img:rounded-2xl prose-img:border prose-img:border-hairline/70 prose-img:shadow-sm
              prose-code:text-[#0071e3] prose-pre:rounded-2xl prose-pre:bg-mist prose-pre:text-ink">
    {{ content }}
  </div>
  <div class="mt-16 pt-8 border-t border-hairline/60">
    <a href="https://discord.gg/Nrf5y8Uaxw" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-[15px] font-medium text-[#0071e3] hover:underline">
      Questions? Join the discussion on Discord
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </a>
  </div>
</article>
